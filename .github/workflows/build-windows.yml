# Windows o'rnatuvchisini qurish (NSIS, x64 + ia32). Qo'lda yoki teg (v*) bilan ishga tushadi.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # Release yaratish uchun

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklar
        run: npm ci

      - name: Tur tekshiruvi
        run: npm run typecheck

      - name: Testlar (vitest)
        run: npm test

      - name: Moslik tekshiruvi (Chromium 108 / Node 16)
        run: npm run check:compat

      # Natija: DelfinSauna-Setup-<v>.exe (universal: x64+ia32 avtomatik tanlaydi),
      #         DelfinSauna-Setup-<v>-x64.exe va DelfinSauna-Setup-<v>-ia32.exe
      - name: O'rnatuvchilarni qurish (x64 + ia32)
        run: npm run dist
        env:
          # Kod imzosi yo'q (sertifikat qo'shilsa CSC_LINK / CSC_KEY_PASSWORD secrets orqali beriladi)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Artefaktni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: DelfinSauna-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # Yuklab olish uchun to'g'ridan-to'g'ri havola: GitHub Releases (har ishga tushishda yangilanadi)
      - name: Release (yuklab olish havolasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: Delfin Sauna ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Delfin Sauna — Windows o'rnatuvchilari.
            - **DelfinSauna-Setup-…-x64.exe** — 64-bitli Windows (7/8/10/11)
            - **DelfinSauna-Setup-…-ia32.exe** — 32-bitli eski Windows
            - **DelfinSauna-Setup-….exe** — universal (o'zi tanlaydi, kattaroq)
            Windows 7 uchun SP1 va yangilanishlar kerak: docs/WINDOWS.md
          files: |
            release/*.exe
